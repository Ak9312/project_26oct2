<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review queue · Content Auditor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="top"></div>
<main id="app" class="page">
  <div class="page-head">
    <h1>Review queue</h1>
    <p>Articles below the pass mark or with a hard flag. Your decision and score are saved to the Review tab.</p>
  </div>
  <section class="card flush" aria-label="Articles to review">
    <div id="queue"><div class="empty">Loading…</div></div>
  </section>

  <section class="card" id="validation">
    <div class="card-head">
      <div>
        <h2 style="margin:0 0 6px;font-size:22px">Validation · 30 test articles</h2>
        <p class="muted" style="margin:0;font-size:15px">Your manual scores against the workflow's, using the same rubric. Add your scores from the bottom of each report.</p>
      </div>
      <button class="btn" type="button" id="refresh-val">Refresh</button>
    </div>
    <div id="val"><div class="muted">Loading…</div></div>
  </section>
</main>
<script type="module" src="/js/pages/review.js"></script>
</body>
</html>
